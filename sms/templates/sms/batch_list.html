<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Batches</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'sms/styles.css' %}">
</head>
<body>
    <main class="page">
        <h1>Batches</h1>
        {% if messages %}
            {% for message in messages %}
                <p class="notice">{{ message }}</p>
            {% endfor %}
        {% endif %}
        <ul class="batch-list">
            {% for batch in batches %}
                <li class="batch-item">
                    <strong>{{ batch.name }}</strong>
                    <div class="actions">
                        <a class="button" href="{% url 'take_attendance' batch.id %}">Take attendance</a>
                        <a class="button button-secondary" href="{% url 'attendance_report' batch.id %}">View report</a>
                    </div>
                </li>
            {% empty %}
                <li class="empty-state">No batches available.</li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
