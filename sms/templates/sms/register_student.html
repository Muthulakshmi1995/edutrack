<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Register student</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'sms/styles.css' %}">
</head>
<body>
    <main class="page">
        <h1>Register student</h1>
        <form method="post" class="card">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <p><a href="{% url 'student_list' %}">View students</a></p>
    </main>
</body>
</html>
