<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Students</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'sms/styles.css' %}">
</head>
<body>
    <main class="page">
        <h1>Students</h1>
        <nav class="actions">
            <a class="button" href="{% url 'register_student' %}">Register a student</a>
            <a class="button button-secondary" href="{% url 'batch_list' %}">Manage batch attendance</a>
        </nav>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Batch</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                        <tr>
                            <td><a href="{% url 'student_attendance_report' student.id %}">{{ student.first_name }} {{ student.last_name }}</a></td>
                            <td>{{ student.email }}</td>
                            <td>{{ student.batch.name }}</td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td colspan="3">No students registered yet.</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
