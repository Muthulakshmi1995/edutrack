services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && gunicorn edutrack.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      DATABASE_PATH: /data/db.sqlite3
    volumes:
      - db_data:/data
    restart: unless-stopped

volumes:
  db_data:
